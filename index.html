<body>
    <script>

    function ValidNumber(message = "Enter a number:") {
  let num;

  while (true) {
    let input = prompt(message);

    if (input === null || input.trim() === "") {
      message = "Please enter a number then try again:";
      continue;
    }

    num = Number(input);
    if (!isNaN(num)) return num;
    message = "Invalid input! enter a valid input:";
  }
}

alert(

);

let num_1 = ValidNumber();
let num_2 = ValidNumber();
let sum = num_1 + num_2;

console.log("Sum:", sum);

alert(`${sum}\nCheck console, it's logged there as per the assignment.`);
</script>
</body>
